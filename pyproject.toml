[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-intake-platform"
version = "0.1.0"
description = "Multi-vertical lead intake and workflow automation platform for service businesses (real estate, law, accounting, and more)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Kiro Platform Team"}
]
keywords = ["lead", "intake", "workflow", "automation", "gmail", "imap", "smtp", "multi-tenant", "saas"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Minimal runtime dependencies for the gmail_lead_sync package itself.
    # The full application runtime (FastAPI, uvicorn, etc.) is declared in
    # requirements.txt, which is the authoritative source for Docker and bare
    # local dev installs. pip install . is not the canonical runtime path for
    # this application repo.
    "SQLAlchemy>=2.0.0",
    "Alembic>=1.12.0",
    "pydantic>=2.0.0",
    "pydantic[email]",
    "cryptography>=41.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    # Dev and test extras for pip install .[dev].
    # For the full dev environment use requirements-dev.txt instead.
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.21.0",
    "hypothesis>=6.90.0",
    "httpx>=0.25.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "black>=23.0.0",
    "isort>=5.12.0",
]
postgres = [
    "psycopg2-binary>=2.9.0",
]

[project.scripts]
# Legacy CLI entry point — kept for backward compatibility
gmail-lead-sync = "gmail_lead_sync.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gmail_lead_sync*"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
# SQLAlchemy Column types are not fully typed; suppress those errors
disable_error_code = [
    "assignment", "arg-type", "return-value", "var-annotated", "misc",
    "valid-type", "no-any-return", "call-overload", "union-attr", "dict-item",
    "operator", "import-untyped", "attr-defined", "str-bytes-safe",
    "no-untyped-def", "has-type", "index",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=gmail_lead_sync --cov=api --cov=worker --cov-report=html --cov-report=term"
# norecursedirs: api/, worker/, migrations/ contain application code, not tests.
# Tests live exclusively in tests/.
norecursedirs = ["api", "worker", "migrations", ".venv", ".git"]
markers = [
    "postgres: marks tests that require a real PostgreSQL instance (set POSTGRES_TEST_URL to run)",
]

[tool.coverage.run]
source = ["gmail_lead_sync", "api", "worker"]
omit = ["*/tests/*", "*/migrations/*", "*/scripts/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
